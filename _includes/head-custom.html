<script>
  document.addEventListener("DOMContentLoaded", function () {
    var currentPath = window.location.pathname;
    var langLink = document.querySelector('a[href="/en/"], a[href="/"]');

    // Find the nav item with the globe icon (or specific title) if the selector above is too broad
    // But based on navigation.yml, the language link is either /en/ or /
    // We need to be careful not to select the "About/CV" link which also points to / or /en/
    // The "About/CV" link usually doesn't have the globe icon.

    var navLinks = document.querySelectorAll('.visible-links a');
    navLinks.forEach(function (link) {
      if (link.innerHTML.includes('fa-globe')) {
        if (currentPath.startsWith('/en/')) {
          // We are in English, link should point to Korean equivalent
          // Remove /en/ from start
          var targetPath = currentPath.replace(/^\/en\//, '/');
          // Handle root /en/ -> /
          if (currentPath === '/en/') targetPath = '/';
          link.href = targetPath;
        } else {
          // We are in Korean, link should point to English equivalent
          // Add /en/ to start
          var targetPath = '/en' + currentPath;
          // Handle root / -> /en/
          if (currentPath === '/') targetPath = '/en/';
          link.href = targetPath;
        }
      }
    });
  });
</script>
