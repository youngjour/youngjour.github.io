project:
  type: website
  output-dir: ../_site/en

website:
  title: "Youngjun Park"
  description: "Youngjun Park — Architect · Urban Data Scientist · Co-founder & CTO of ar-ge inc. Urban computing, smart cities, AI-based urban analysis."
  site-url: "https://youngjour.github.io/en/"
  image: "../assets/images/og-image.jpg"
  favicon: "../assets/icons/favicon.ico"
  open-graph:
    locale: en_US
    site-name: "Youngjun Park"
  twitter-card:
    card-style: summary_large_image

  page-navigation: true
  back-to-top-navigation: true

  navbar:
    title: "Youngjun Park"
    background: white
    left:
      - text: "About"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Design"
        href: design.qmd
    right:
      - text: "한국어"
        href: ../index.html

  page-footer:
    left: "© 2026 Youngjun Park"
    right:
      - icon: envelope
        href: "mailto:youngjourpark@gmail.com"
      - icon: github
        href: "https://github.com/youngjour"
      - icon: linkedin
        href: "https://linkedin.com/in/youngjourpark"

format:
  html:
    theme:
      - cosmo
      - ../assets/css/custom.scss
    lang: en
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    linkcolor: "#1a5490"
    toc: true
    toc-location: right
    code-fold: show
    code-tools: false
    code-copy: true
    citations-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
          <link rel="stylesheet" as="style" crossorigin
                href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    include-after-body:
      - text: |
          <script src="../assets/js/relocate-sidebar-elements.js"></script>

filters:
  - quarto

execute:
  freeze: auto