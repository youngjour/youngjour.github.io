# Awards, honors, and competitive wins.
#
# Categories are declared in `award_categories:` — the build script
# errors if an award references an unknown category.
#
# Renderer convention:
#   - category: academic → title rendered in **bold** on the site.
#   - category: sports   → title rendered as a plain bullet.
# The CV generator (Phase 3b) groups by category.

award_categories:
  - id: academic
    label:
      ko: "학술·전문"
      en: "Academic and Professional"
  - id: sports
    label:
      ko: "스포츠"
      en: "Sports"

awards:
