      - "GS건설"
      - "기아자동차-이노션"
      - "스왈라비"
    en:
      - "GS E&C"
      - "Kia Motors–Innocean"
      - "Swallaby"

  invited_lectures:
    ko:
      - "서울대학교 건축학과"
      - "KAIST 전산학부"
      - "한국기술교육대학교 건축공학과"
      - "중앙대학교 건축학과"
