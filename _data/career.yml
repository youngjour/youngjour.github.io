# Chronological career positions. Shown on the About page "Career"
# section (both languages) and in the "Career history" list in
# llms.txt.
#
# Fields:
#   title.{ko,en}           role title. `.llms` override only when the
#                            llms sentence-case form differs (see
#                            arge-cto: "Co-founder and CTO" vs the
#                            site's "Co-founder · CTO").
#   employer.{ko,en}        organisation. `.llms` override when the
#                            llms re-orders / renames it.
#   period.{ko,en}          display period for the site. llms form is
#                            auto-normalised: "Present" → "present";
#                            "2022 – 2025" → "2022–2025". Override with
#                            `period.llms` only if auto-form is wrong.
#   bullets.{ko,en}         optional sub-bullets under the position.
#                            When absent or null, no list is rendered.

career:
