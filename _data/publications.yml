# Single source of truth for publications.
#
# Ordering: newest-first within this list. The build script regroups by
# year / status when rendering.
#
# Fields:
#   id            kebab-case slug, unique across this file.
#   year          integer.
#   type          journal | conference | workshop | poster | other.
#   status        published | in-review | accepted | poster.
#   authors       ordered list; wrap site owner in ** **. Use long form
#                 ("Park, Youngjun"); build script derives short form
#                 for llms.txt.
#   title         paper title, no trailing punctuation.
#   venue.ko      venue name on Korean research page.
#   venue.en      venue name on English research page.
#   venue.llms    optional — venue name in llms.txt if it differs from
#                 the research-page form (e.g. "AESOP'24" vs "AESOP '24").
#   pages, volume, issue   optional; shown on both research and llms.
#   doi           DOI string (no "https://doi.org/" prefix).
#   url           fallback URL when no DOI (applied to both pages and
#                 llms.txt).
#   url_label     link text for the research page: Published | Preprint
#                 | PDF.
#   url_italic    defaults true; set false only to preserve the single
#                 historical quirk where the link line is not wrapped in
#                 asterisks (2019 "Car-use and Non-work Travel" paper).
#   research_only_url   URL shown on the research page but NOT in
#                 llms.txt (e.g. a Google Scholar search link).
#   highlight     optional object; presence puts the paper on the
#                 About-page "Research Works" highlight.
#     period.{ko,en}   must exactly match one of the labels in
#                       research_work_periods below.
#     author_label     optional override; if absent, derived from
#                       authors + owner position.
#     venue_short      short venue form for About-page highlight
#                       (language-independent, e.g. "CIKM").
#     summary.{ko,en}  tail text after "— " on the About page.

research_work_periods:
  - label:
      ko: "박사과정 · 공간 통계와 모바일 위치 데이터"
