# Research projects / grants.
#
# Fields:
#   id              kebab-case slug.
#   title.{ko,en}   project title.
#   period          string, en-dash separated (e.g. "2024–2025").
#   research_meta   meta line shown under the title on the Research
#                   page ({ko,en}). Include bold/italic markdown.
#   highlight       true → appears in the About-page "Projects" top-5.
#                   Exactly 5 projects must have highlight: true.
#   index_meta      meta line shown on the About page ({ko,en}); often
#                   shorter than research_meta. Required when
#                   highlight: true.
#   index_summary   summary paragraph shown below index_meta on the
#                   About page ({ko,en}). Required when highlight: true.
#   llms_line       trailing sentence in llms.txt after "{title} ({period}). ".
#                   Handwritten for each entry to match the current
#                   llms.txt.

