project:
  type: website
  output-dir: _site
  resources:
    - "robots.txt"
    - "llms.txt"
    - "assets/"
    - "m7-guide/"
    - ".nojekyll"
    - ".well-known/"
  render:
    - "*.qmd"
    - "notes/**/*.qmd"
    - "!en/"

website:
  title: "Youngjun Park"
  description: "박영준 — 도시연구자, 건축가. 사람들의 활동과 의견이 도시계획에 어떻게 반영될 수 있는지 연구합니다. 건축학 박사, ar-ge inc. 공동창립자·CTO."
  site-url: "https://youngjour.github.io"
  image: "/assets/images/og-image.jpg"
  favicon: "assets/icons/favicon.ico"
  open-graph:
    locale: ko_KR
    site-name: "Youngjun Park"
  twitter-card:
    card-style: summary_large_image

  page-navigation: true
  back-to-top-navigation: true

  navbar:
    title: "Youngjun Park"
    background: white
    left:
      - text: "About"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Design"
        href: design.qmd
      - text: "Notes"
        href: notes/index.qmd
    right:
      - text: '<i class="fas fa-globe"></i> EN'
        href: en/index.html
      - text: "CV (한국어)"
        href: assets/cv_ko.pdf
      - text: "CV (English)"
        href: assets/cv_en.pdf


format:
  html:
    theme:
      - cosmo
      - assets/css/custom.scss
    lang: ko
    mainfont: "Pretendard, -apple-system, BlinkMacSystemFont, sans-serif"
    linkcolor: "#1a5490"
    toc: true
    toc-location: right
    code-fold: show
    code-tools: false
    code-copy: true
    citations-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
          <link rel="stylesheet" as="style" crossorigin
                href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    include-after-body:
      - text: |
          <script src="/assets/js/relocate-sidebar-elements.js"></script>

filters:
  - quarto

execute:
  freeze: auto